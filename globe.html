<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three.js Globe</title>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 3, 5);
scene.add(sun);

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshStandardMaterial({ color: 0x2266cc, roughness: 0.8, metalness: 0.1 })
);
scene.add(globe);

const wire = new THREE.Mesh(
  new THREE.SphereGeometry(1.005, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.15 })
);
scene.add(wire);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  globe.rotation.y += 0.003;
  wire.rotation.y += 0.003;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
